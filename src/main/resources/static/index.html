<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --accent2: #0ea5e9;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1e293b;
            --muted: #94a3b8;
            --glow: rgba(59,130,246,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 24px rgba(59,130,246,0.4);
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #1e293b, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            margin-left: auto;
        }

        .stat {
            text-align: right;
        }

        .stat-val {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Section layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: var(--surface2);
        }

        th {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            text-align: left;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: var(--surface2);
        }

        .id-badge {
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            background: var(--glow);
            color: var(--accent);
            border: 1px solid rgba(59,130,246,0.2);
            padding: 3px 9px;
            border-radius: 6px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            margin-right: 10px;
            color: #fff;
            vertical-align: middle;
        }

        .email-chip {
            font-size: 12px;
            color: var(--muted);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59,130,246,0.3);
        }
        .btn-primary:hover { background: #2563eb; box-shadow: 0 6px 20px rgba(59,130,246,0.4); }

        .btn-danger {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.2);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        .btn-edit {
            background: rgba(59,130,246,0.1);
            color: var(--accent);
            border: 1px solid rgba(59,130,246,0.2);
        }
        .btn-edit:hover { background: rgba(59,130,246,0.2); }

        .btn-ghost {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16,185,129,0.3);
        }
        .btn-success:hover { background: #059669; }

        /* Right panel */
        .panel-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search */
        .search-row {
            display: flex;
            gap: 8px;
            padding: 16px 24px;
        }

        .input-wrap {
            position: relative;
            flex: 1;
        }

        .input-wrap .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px 9px 34px;
            color: var(--text);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        input::placeholder { color: var(--muted); }

        /* Form */
        .form-body {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field input {
            padding-left: 12px;
        }

        .form-actions {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            animation: slideIn 0.3s ease;
            min-width: 240px;
        }

        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Search results */
        #searchResult {
            padding: 0 24px 16px;
            font-size: 13px;
        }

        #searchResult ul {
            list-style: none;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #searchResult li {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
        }

        .empty-icon { font-size: 36px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; }

        /* Mode indicator */
        .mode-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .mode-add { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
        .mode-edit { background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .stats-bar { display: none; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div class="header-icon">📚</div>
        <div>
            <h1>QUẢN LÝ SINH VIÊN</h1>
            <p>Student Management System</p>
        </div>
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-val" id="totalCount">—</div>
                <div class="stat-label">Sinh viên</div>
            </div>
        </div>
    </header>

    <div class="grid">
        <!-- LEFT: Table -->
        <div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="dot"></span>
                        Danh sách sinh viên
                    </div>
                    <button class="btn btn-ghost" onclick="loadStudents()">↺ Tải lại</button>
                </div>

                <!-- Search -->
                <div class="search-row">
                    <div class="input-wrap">
                        <span class="icon">🔍</span>
                        <input type="text" id="searchName" placeholder="Tìm theo tên...">
                    </div>
                    <button class="btn btn-primary" onclick="searchStudent()">Tìm</button>
                </div>

                <div id="searchResult"></div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Sinh viên</th>
                                <th>Tuổi</th>
                                <th>Email</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="studentBody">
                            <tr><td colspan="5"><div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">Đang tải dữ liệu...</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- RIGHT: Forms -->
        <div class="panel-stack">
            <!-- Add / Edit Form -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="dot" id="formDot"></span>
                        <span id="formTitle">Thêm sinh viên</span>
                    </div>
                    <span class="mode-badge mode-add" id="modeBadge">Thêm mới</span>
                </div>
                <div class="form-body">
                    <div class="field">
                        <label>ID</label>
                        <input type="number" id="formId" placeholder="Nhập ID...">
                    </div>
                    <div class="field">
                        <label>Họ và tên</label>
                        <input type="text" id="formName" placeholder="Nguyễn Văn A...">
                    </div>
                    <div class="field">
                        <label>Tuổi</label>
                        <input type="number" id="formAge" placeholder="20">
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" id="formEmail" placeholder="example@email.com">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" id="submitBtn" onclick="submitForm()">➕ Thêm</button>
                    <button class="btn btn-ghost" onclick="resetForm()">✕ Hủy</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<script>
    const API = '/api/students';
    let editMode = false;

    function toast(msg, type = 'info') {
        const icons = { success: '✅', error: '❌', info: 'ℹ️' };
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    function getInitial(name) {
        return name ? name.trim()[0].toUpperCase() : '?';
    }

    function loadStudents() {
        fetch(API)
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalCount').textContent = data.length;
                const tbody = document.getElementById('studentBody');
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Chưa có sinh viên nào</div></div></td></tr>`;
                    return;
                }
                tbody.innerHTML = data.map(sv => `
                    <tr>
                        <td><span class="id-badge">#${sv.id}</span></td>
                        <td><span class="avatar">${getInitial(sv.name)}</span>${sv.name}</td>
                        <td>${sv.age}</td>
                        <td><span class="email-chip">${sv.email}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-danger" onclick="deleteStudent(${sv.id})">🗑</button>
                                <button class="btn btn-edit" onclick="fillEdit(${sv.id},'${sv.name}',${sv.age},'${sv.email}')">✏️</button>
                            </div>
                        </td>
                    </tr>`).join('');
            })
            .catch(() => toast('Không thể kết nối API', 'error'));
    }

    function searchStudent() {
        const name = document.getElementById('searchName').value.trim();
        if (!name) { document.getElementById('searchResult').innerHTML = ''; loadStudents(); return; }
        fetch(`${API}/search?name=${encodeURIComponent(name)}`)
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('searchResult');
                if (data.length === 0) {
                    el.innerHTML = `<p style="color:var(--muted);font-size:13px">Không tìm thấy kết quả.</p>`;
                    return;
                }
                el.innerHTML = `<p style="font-size:12px;color:var(--muted)">Tìm thấy <b style="color:var(--accent)">${data.length}</b> kết quả</p>
                    <ul>${data.map(sv => `<li><b>${sv.name}</b> — ${sv.age} tuổi — <span style="color:var(--muted)">${sv.email}</span></li>`).join('')}</ul>`;
            });
    }

    function submitForm() {
        const id    = parseInt(document.getElementById('formId').value);
        const name  = document.getElementById('formName').value.trim();
        const age   = parseInt(document.getElementById('formAge').value);
        const email = document.getElementById('formEmail').value.trim();
        if (!name || !email || isNaN(id) || isNaN(age)) { toast('Vui lòng điền đầy đủ thông tin', 'error'); return; }

        if (editMode) {
            fetch(`${API}/update/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, name, age, email })
            })
            .then(res => res.json())
            .then(data => { toast(`Đã cập nhật: ${data.name}`, 'success'); resetForm(); loadStudents(); });
        } else {
            fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, name, age, email })
            })
            .then(res => res.json())
            .then(data => { toast(`Đã thêm: ${data.name}`, 'success'); resetForm(); loadStudents(); });
        }
    }

    function deleteStudent(id) {
        if (!confirm(`Xóa sinh viên ID ${id}?`)) return;
        fetch(`${API}/delete/${id}`, { method: 'POST' })
            .then(() => { toast(`Đã xóa ID ${id}`, 'success'); loadStudents(); });
    }

    function fillEdit(id, name, age, email) {
        editMode = true;
        document.getElementById('formId').value = id;
        document.getElementById('formId').disabled = true;
        document.getElementById('formName').value = name;
        document.getElementById('formAge').value = age;
        document.getElementById('formEmail').value = email;
        document.getElementById('formTitle').textContent = 'Chỉnh sửa sinh viên';
        document.getElementById('modeBadge').className = 'mode-badge mode-edit';
        document.getElementById('modeBadge').textContent = 'Đang sửa';
        document.getElementById('submitBtn').textContent = '✏️ Cập nhật';
        document.getElementById('submitBtn').className = 'btn btn-primary';
        document.querySelector('.panel-stack').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        editMode = false;
        ['formId','formName','formAge','formEmail'].forEach(id => {
            document.getElementById(id).value = '';
            document.getElementById(id).disabled = false;
        });
        document.getElementById('formTitle').textContent = 'Thêm sinh viên';
        document.getElementById('modeBadge').className = 'mode-badge mode-add';
        document.getElementById('modeBadge').textContent = 'Thêm mới';
        document.getElementById('submitBtn').textContent = '➕ Thêm';
        document.getElementById('submitBtn').className = 'btn btn-success';
    }

    // Enter to search
    document.getElementById('searchName').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudent(); });

    window.onload = loadStudents;
</script>
</body>
</html>
